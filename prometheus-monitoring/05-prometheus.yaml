apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Keep a month of history, but never let the TSDB outgrow its volume -
            # whichever limit is hit first wins.
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.retention.size=8GB
            # Enables POST /prometheus/-/reload so config changes need no restart.
            - --web.enable-lifecycle
            # Serve under /prometheus so the UI works behind the path-based ingress.
            # route-prefix takes only the path, so no node address is baked in and any
            # node's IP works. (--web.external-url would also set this, but demands a
            # full URL and would hardcode one node.)
            # NOTE: this also moves direct NodePort access to :30090/prometheus.
            - --web.route-prefix=/prometheus
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      name: http
