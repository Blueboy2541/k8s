apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Keep a month of history, but never let the TSDB outgrow its volume -
            # whichever limit is hit first wins.
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.retention.size=8GB
            # Enables POST /prometheus/-/reload so config changes need no restart.
            - --web.enable-lifecycle
            # Serve under /prometheus for the path-based ingress. Only the PATH of this
            # URL matters: it sets route-prefix and is what Prometheus prepends to the
            # links and redirects it generates. The host is a placeholder that is never
            # used for browsing, so no node address is hardcoded and any node's IP works.
            # (--web.route-prefix alone is not enough - it makes Prometheus serve under
            # the prefix but still redirect to unprefixed paths, which the ingress 404s.)
            # NOTE: this also moves direct NodePort access to :30090/prometheus.
            - --web.external-url=http://localhost:9090/prometheus
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      name: http
