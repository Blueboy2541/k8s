# Statically provisioned volume for the Prometheus TSDB.
#
# Before applying, on node03:
#   sudo mkdir -p /var/lib/prometheus-data
#   sudo chown 65534:65534 /var/lib/prometheus-data
#
# `local` rather than hostPath so the scheduler knows which node holds the data and
# always places the pod there. Pick a node with room for the retention size plus
# compaction headroom.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data-pv
  labels:
    app: prometheus
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  # Retain: deleting the PVC leaves the data on disk.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  local:
    path: /var/lib/prometheus-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node03
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
  labels:
    app: prometheus
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  # The TSDB is on a ReadWriteOnce volume, so the old pod must release it before the
  # new one can mount it. A rolling update would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # prom/prometheus runs as nobody (65534). A freshly created directory is owned
      # by root, so without fsGroup the container cannot write to /prometheus.
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Keep a month of history, but never let the TSDB outgrow its volume -
            # whichever limit is hit first wins. The size cap is what actually
            # protects the disk, since PV capacity is not enforced.
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.retention.size=8GB
            # Enables POST /prometheus/-/reload so config changes need no restart.
            - --web.enable-lifecycle
            # Serve under /prometheus for the path-based ingress. Only the PATH of this
            # URL matters: it sets route-prefix and is what Prometheus prepends to the
            # links and redirects it generates. The host is a placeholder that is never
            # used for browsing, so no node address is hardcoded and any node's IP works.
            # (--web.route-prefix alone is not enough - it makes Prometheus serve under
            # the prefix but still redirect to unprefixed paths, which the ingress 404s.)
            # NOTE: this also moves direct NodePort access to :30090/prometheus.
            - --web.external-url=http://localhost:9090/prometheus
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /prometheus/-/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: http
            initialDelaySeconds: 30
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      name: http
