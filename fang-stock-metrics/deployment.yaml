apiVersion: apps/v1
kind: Deployment
metadata:
  name: fang-stock-metrics
  namespace: default
  labels:
    app: fang-stock-metrics
spec:
  replicas: 1
  # The ticker list lives on a ReadWriteOnce volume and is cached in memory, so the
  # old pod must fully release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fang-stock-metrics
  template:
    metadata:
      labels:
        app: fang-stock-metrics
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: fang-stock-metrics
          # Built and pushed by .github/workflows/fang-stock-metrics.yml on every push
          # to main. Swap :latest for a sha-<commit> tag to pin a specific build.
          image: ghcr.io/blueboy2541/fang-stock-metrics:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: metrics
            - containerPort: 8080
              name: admin
          env:
            - name: POLL_INTERVAL_SECONDS
              value: "60"
            - name: TICKERS_FILE
              value: /data/tickers.json
            - name: FINNHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finnhub-credentials
                  key: api-key
          volumeMounts:
            - name: ticker-data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
      volumes:
        - name: ticker-data
          persistentVolumeClaim:
            claimName: fang-stock-metrics-data
